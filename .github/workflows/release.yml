name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  # Reuse the CI workflow (format + analyze + test) as a gate: the APK is only
  # built and published if this passes.
  analyze-and-test:
    name: Analyze & Test
    uses: ./.github/workflows/ci.yml

  build-apk:
    name: Build & publish APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=release
          storeFile=../release-keystore.jks
          EOF

      # The visible app version comes from the pushed tag (e.g. v1.0.0); local
      # debug builds fall back to the `dev` default in AppConstants.appVersion.
      - name: Build release APK
        run: flutter build apk --release --flavor prod --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Publish APK to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-prod-release.apk
